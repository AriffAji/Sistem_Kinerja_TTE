<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lacak Surat - PPNP</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',Tahoma,sans-serif; background:#f4f7f6; color:#2c3e50; }
  .atas { background:linear-gradient(135deg,#2c3e50,#3498db); color:white; padding:36px 20px 70px; text-align:center; }
  .atas h1 { margin:0 0 6px; font-size:1.5rem; }
  .atas p  { margin:0; opacity:.85; font-size:.9rem; }
  .wadah { max-width:560px; margin:-44px auto 40px; padding:0 16px; }
  .kartu { background:white; border-radius:14px; padding:22px; box-shadow:0 8px 28px rgba(0,0,0,.1); margin-bottom:16px; }
  label { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#95a5a6; }
  .baris { display:flex; gap:8px; margin-top:8px; }
  input { flex:1; padding:12px; border:1.5px solid #ccd; border-radius:8px; font-size:1.05rem;
          font-family:monospace; letter-spacing:.08em; text-transform:uppercase; min-width:0; }
  input:focus { outline:none; border-color:#3498db; }
  button { padding:12px 22px; border:none; border-radius:8px; background:#2ecc71; color:white;
           font-weight:700; cursor:pointer; font-size:.95rem; }
  button:disabled { opacity:.6; cursor:wait; }
  .galat { background:#fdf2f2; border-left:4px solid #e74c3c; color:#922b21; padding:12px 14px;
           border-radius:6px; font-size:.88rem; display:none; margin-top:14px; }
  .judul-status { font-size:1.2rem; font-weight:800; margin:0 0 4px; }
  .ket { color:#7f8c8d; font-size:.9rem; line-height:1.55; margin:0 0 18px; }
  .info { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; }
  .info div { background:#f4f7f6; border-radius:8px; padding:10px 12px; }
  .info small { display:block; font-size:.68rem; text-transform:uppercase; color:#95a5a6; font-weight:700; }
  .info b { font-size:.88rem; }
  .perihal { background:#f4f7f6; border-radius:8px; padding:10px 12px; font-weight:600; margin-bottom:6px; }
  .langkah { list-style:none; margin:0; padding:0; position:relative; }
  .langkah::before { content:''; position:absolute; left:17px; top:8px; bottom:8px; width:2px; background:#e0e6ea; }
  .langkah li { display:flex; gap:14px; align-items:center; margin-bottom:18px; position:relative; }
  .langkah li:last-child { margin-bottom:0; }
  .titik { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
           font-size:1rem; flex-shrink:0; z-index:1; background:#ecf0f1; border:2px solid #d5dbdd; color:#95a5a6; }
  .selesai .titik  { background:#eafaf1; border-color:#2ecc71; color:#27ae60; }
  .berjalan .titik { background:#fef9e7; border-color:#f39c12; color:#e67e22; }
  .terhenti .titik { background:#fdf2f2; border-color:#e74c3c; color:#e74c3c; }
  .langkah .nama { font-weight:700; font-size:.95rem; }
  .belum .nama { color:#95a5a6; }
  .kaki { text-align:center; font-size:.75rem; color:#95a5a6; margin-top:10px; }
  .kaki a { color:#3498db; text-decoration:none; }
</style>
</head>
<body>
  <div class="atas">
    <h1>🔍 Lacak Surat</h1>
    <p>Politeknik Pertanian Negeri Payakumbuh</p>
  </div>

  <div class="wadah">
    <div class="kartu">
      <label for="kode">Kode Pelacakan</label>
      <div class="baris">
        <input id="kode" placeholder="PPNP-XXXXXX" maxlength="12" autocomplete="off">
        <button id="btn" onclick="lacak()">Lacak</button>
      </div>
      <div class="galat" id="galat"></div>
    </div>

    <div class="kartu" id="hasil" style="display:none;">
      <div class="perihal" id="hPerihal"></div>
      <div style="margin:16px 0 4px;">
        <p class="judul-status" id="hJudul"></p>
        <p class="ket" id="hKet"></p>
      </div>
      <ul class="langkah" id="hTahap"></ul>
      <div class="info">
        <div><small>Tanggal Diterima</small><b id="hTerima">-</b></div>
        <div><small>Lama Proses</small><b id="hLama">-</b></div>
        <div style="grid-column:1/-1;"><small>Pembaruan Terakhir</small><b id="hUpdate">-</b></div>
      </div>

      <div id="blokHasil" style="display:none; margin-top:18px; border-radius:10px; padding:14px 16px;">
        <small style="display:block; font-size:.68rem; text-transform:uppercase; font-weight:700; margin-bottom:6px; opacity:.7;">
          Hasil Akhir
        </small>
        <div id="hasilJudul" style="font-weight:800; font-size:1rem;"></div>
        <div id="hasilKet" style="font-size:.88rem; line-height:1.55; margin-top:4px;"></div>
      </div>
    </div>

    <div class="kaki">Kode pelacakan tertera pada tanda terima surat Anda.<br>
      Surat resmi dapat diverifikasi keasliannya melalui QR Code pada dokumen.</div>
  </div>

<script>
  const IKON = { selesai:'✔', berjalan:'⏳', terhenti:'⚠', belum:'•' };
  const $ = id => document.getElementById(id);

  function tglIndo(s) {
    if (!s) return '-';
    const d = new Date(s.replace(' ', 'T'));
    if (isNaN(d)) return s;
    return d.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' })
         + (s.length > 10 ? ', ' + s.slice(11, 16) + ' WIB' : '');
  }

  async function lacak() {
    const kode = $('kode').value.trim();
    $('galat').style.display = 'none';
    $('hasil').style.display = 'none';
    if (!kode) { tampilGalat('Masukkan kode pelacakan terlebih dahulu.'); return; }

    $('btn').disabled = true; $('btn').textContent = '⏳';
    try {
      const res = await fetch('/api/publik/lacak?kode=' + encodeURIComponent(kode));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { tampilGalat(data.detail || 'Terjadi kesalahan.'); return; }
      tampilHasil(data);
      history.replaceState(null, '', '?kode=' + encodeURIComponent(data.kode));
    } catch (e) {
      tampilGalat('Koneksi gagal. Coba lagi.');
    } finally {
      $('btn').disabled = false; $('btn').textContent = 'Lacak';
    }
  }

  function tampilGalat(pesan) {
    $('galat').textContent = pesan;     // textContent: aman dari XSS
    $('galat').style.display = 'block';
  }

  function tampilHasil(d) {
    $('hPerihal').textContent = d.perihal;
    $('hJudul').textContent   = d.judul_status;
    $('hKet').textContent     = d.keterangan;
    $('hTerima').textContent  = d.tanggal_diterima ? tglIndo(d.tanggal_diterima) : '-';
    $('hLama').textContent    = d.lama_hari === null ? '-' : d.lama_hari + ' hari';
    $('hUpdate').textContent  = tglIndo(d.update_terakhir);

    const ul = $('hTahap');
    ul.innerHTML = '';
    d.tahap.forEach(t => {
      const li = document.createElement('li');
      li.className = t.status;
      const titik = document.createElement('div');
      titik.className = 'titik'; titik.textContent = IKON[t.status] || '•';
      const nama = document.createElement('div');
      nama.className = 'nama'; nama.textContent = t.label;
      li.append(titik, nama);
      ul.appendChild(li);
    });

    const h = d.hasil_akhir, bh = $('blokHasil');
    if (h) {
      const arsip = h.kode === 'diarsipkan';
      bh.style.background = arsip ? '#f4f7f6' : '#eafaf1';
      bh.style.border = '1px solid ' + (arsip ? '#d5dbdd' : '#2ecc71');
      $('hasilJudul').textContent = h.ikon + ' ' + h.judul;
      $('hasilKet').textContent = h.keterangan;
      bh.style.display = 'block';
    } else {
      bh.style.display = 'none';
    }

    $('hasil').style.display = 'block';
  }

  $('kode').addEventListener('keydown', e => { if (e.key === 'Enter') lacak(); });
  const awal = new URLSearchParams(location.search).get('kode');
  if (awal) { $('kode').value = awal; lacak(); }
</script>
</body>
</html>
